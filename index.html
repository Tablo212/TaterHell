
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Survivor - Arena</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10131c;color:white;
 font-family:Arial,sans-serif;display:flex;
 align-items:center;justify-content:center;
 min-height:100vh;overflow:hidden
}
#game{position:relative;width:min(960px,100vw)}
canvas{
 display:block;width:100%;height:auto;
 background:#202a35;border:3px solid #536176;
 border-radius:10px;cursor:crosshair
}
#help{text-align:center;color:#aebbd0;font-size:13px;padding:9px}
</style>
</head>
<body>
<div id="game">
<canvas id="c" width="960" height="600"></canvas>
<div id="help">WASD / Arrow Keys: Move • Auto Attack: Nearest Enemy • Survive the waves!</div>
</div>
<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const W=960,H=600;

const difficulties=[
 {name:"EASY",enemy:0.75,shop:0.8,color:"#48df8a"},
 {name:"NORMAL",enemy:1,shop:1,color:"#55c7ff"},
 {name:"HARD",enemy:1.4,shop:1.3,color:"#ffca58"},
 {name:"EXPERT",enemy:2,shop:1.8,color:"#ff784e"},
 {name:"NIGHTMARE",enemy:3,shop:2.5,color:"#ed4e72"}
];

// Eight unique enemy types
const enemyTypes=[
 {name:"Slime",color:"#65df76",hp:22,speed:65,damage:7,r:13,coin:2},
 {name:"Runner",color:"#f2d34e",hp:15,speed:125,damage:8,r:10,coin:2},
 {name:"Tank",color:"#a58aef",hp:90,speed:34,damage:18,r:23,coin:6},
 {name:"Bat",color:"#e88cf5",hp:28,speed:105,damage:10,r:12,coin:3},
 {name:"Brute",color:"#ef795b",hp:65,speed:55,damage:17,r:19,coin:5},
 {name:"Ghost",color:"#8de9ed",hp:42,speed:80,damage:13,r:15,coin:4},
 {name:"Demon",color:"#ff405f",hp:115,speed:75,damage:22,r:21,coin:8},
 {name:"Reaper",color:"#e3e3e3",hp:180,speed:95,damage:28,r:24,coin:12}
];

let state="menu",difficulty=1,wave=1;
let player, enemies=[],bullets=[],particles=[];
let keys={},mouse={x:480,y:300};
let coins=0,kills=0,spawned=0,totalToSpawn=0;
let spawnTimer=0,shootTimer=0,last=0;
let upgrades={damage:0,speed:0,rate:0,range:0};
let shopButtons=[];

function reset(){
 wave=1;coins=0;kills=0;
 upgrades={damage:0,speed:0,rate:0,range:0};
 player={
  x:W/2,y:H/2,r:15,hp:100,maxHp:100,
  damage:18,speed:205,fireRate:.42,range:360
 };
 enemies=[];bullets=[];particles=[];
 startWave();
}

function startWave(){
 state="playing";
 enemies=[];bullets=[];
 spawned=0;
 totalToSpawn=8+wave*4;
 spawnTimer=0.5;
 shootTimer=0;
}

function enemyScale(){
 return difficulties[difficulty].enemy *
 (1+wave*.13);
}

function shopPrice(base){
 return Math.round(
  base*difficulties[difficulty].shop*
  (1+wave*.18)
 );
}

function spawnEnemy(){
 let index=Math.floor(Math.random()*
  Math.min(8,2+Math.floor(wave/2)));
 let t=enemyTypes[index];
 let scale=enemyScale();

 let side=Math.floor(Math.random()*4);
 let x=side===0?0:side===1?W:
       Math.random()*W;
 let y=side===2?0:side===3?H:
       Math.random()*H;

 enemies.push({
  x,y,r:t.r,
  hp:t.hp*scale,
  maxHp:t.hp*scale,
  speed:t.speed*(.8+scale*.12),
  damage:t.damage*scale,
  color:t.color,
  name:t.name,
  coin:t.coin,
  type:index
 });
}

function nearestEnemy(){
 let best=null,dist=player.range;
 for(const e of enemies){
  let d=Math.hypot(e.x-player.x,e.y-player.y);
  if(d<dist){dist=d;best=e;}
 }
 return best;
}

function shoot(){
 let target=nearestEnemy();
 if(!target)return;
 let a=Math.atan2(target.y-player.y,target.x-player.x);
 bullets.push({
  x:player.x,y:player.y,
  vx:Math.cos(a)*570,vy:Math.sin(a)*570,
  damage:player.damage,life:.9
 });
}

function burst(x,y,color){
 for(let i=0;i<7;i++){
  let a=Math.random()*Math.PI*2;
  let s=30+Math.random()*100;
  particles.push({
   x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
   life:.4,color
  });
 }
}

function update(dt){
 if(state!=="playing")return;

 // Movement
 let dx=(keys.d||keys.ArrowRight?1:0)-
        (keys.a||keys.ArrowLeft?1:0);
 let dy=(keys.s||keys.ArrowDown?1:0)-
        (keys.w||keys.ArrowUp?1:0);
 let len=Math.hypot(dx,dy)||1;

 player.x+=dx/len*player.speed*dt;
 player.y+=dy/len*player.speed*dt;
 player.x=Math.max(player.r,Math.min(W-player.r,player.x));
 player.y=Math.max(player.r,Math.min(H-player.r,player.y));

 // Automatic shooting
 shootTimer-=dt;
 if(shootTimer<=0){
  shoot();
  shootTimer=player.fireRate;
 }

 // Enemy spawning
 if(spawned<totalToSpawn){
  spawnTimer-=dt;
  if(spawnTimer<=0){
   spawnEnemy();
   spawned++;
   spawnTimer=Math.max(.17,.85-wave*.025)*
    (.7+Math.random()*.6);
  }
 }

 // Bullets
 for(let i=bullets.length-1;i>=0;i--){
  let b=bullets[i];
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  let hit=false;
  for(let j=enemies.length-1;j>=0;j--){
   let e=enemies[j];
   if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+5){
    e.hp-=b.damage;
    burst(b.x,b.y,"#ffe69a");
    hit=true;
    if(e.hp<=0){
     coins+=e.coin;
     kills++;
     burst(e.x,e.y,e.color);
     enemies.splice(j,1);
    }
    break;
   }
  }
  if(hit||b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H)
   bullets.splice(i,1);
 }

 // Enemies
 for(let i=enemies.length-1;i>=0;i--){
  let e=enemies[i];
  let a=Math.atan2(player.y-e.y,player.x-e.x);
  e.x+=Math.cos(a)*e.speed*dt;
  e.y+=Math.sin(a)*e.speed*dt;

  if(Math.hypot(e.x-player.x,e.y-player.y)<
     e.r+player.r){
   player.hp-=e.damage*dt;
   if(player.hp<=0){
    player.hp=0;state="gameover";
   }
  }
 }

 // Particles
 for(let i=particles.length-1;i>=0;i--){
  let p=particles[i];
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.life-=dt;
  if(p.life<=0)particles.splice(i,1);
 }

 if(spawned>=totalToSpawn&&enemies.length===0){
  state="shop";
 }
}

function text(str,x,y,size=18,color="white",align="left"){
 ctx.fillStyle=color;
 ctx.font=`bold ${size}px Arial`;
 ctx.textAlign=align;
 ctx.fillText(str,x,y);
 ctx.textAlign="left";
}

function button(x,y,w,h,label,color,sub=""){
 ctx.fillStyle="#111a28";
 ctx.fillRect(x,y,w,h);
 ctx.strokeStyle=color;
 ctx.lineWidth=2;
 ctx.strokeRect(x,y,w,h);
 text(label,x+w/2,y+25,17,color,"center");
 if(sub)text(sub,x+w/2,y+47,12,"#b8c4d5","center");
 return {x,y,w,h};
}

function drawBackground(){
 ctx.fillStyle="#202a35";
 ctx.fillRect(0,0,W,H);
 ctx.strokeStyle="#293746";
 ctx.lineWidth=1;
 for(let x=0;x<W;x+=40){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
 }
 for(let y=0;y<H;y+=40){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }
}

function drawPlayer(){
 ctx.fillStyle="#4bbcff";
 ctx.beginPath();
 ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
 ctx.fill();
 ctx.strokeStyle="#d9f5ff";
 ctx.lineWidth=3;
 ctx.stroke();

 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.arc(player.x+4,player.y-4,3,0,Math.PI*2);
 ctx.fill();
}

function drawHUD(){
 ctx.fillStyle="#111a28";
 ctx.fillRect(0,0,W,62);

 text("PIXEL SURVIVOR",15,25,18,"#60d5ff");
 text("WAVE "+wave,15,48,14,"white");
 text("COINS: "+coins,210,26,17,"#ffd85a");
 text("KILLS: "+kills,210,48,13,"#c6d3e4");
 text(difficulties[difficulty].name,420,28,17,
  difficulties[difficulty].color);

 ctx.fillStyle="#3a202c";
 ctx.fillRect(700,19,240,19);
 ctx.fillStyle="#54df83";
 ctx.fillRect(700,19,240*Math.max(0,player.hp/player.maxHp),19);
 ctx.strokeStyle="white";
 ctx.strokeRect(700,19,240,19);
 text("HP "+Math.ceil(player.hp)+"/"+player.maxHp,
  820,14,12,"white","center");
}

function draw(){
 drawBackground();

 if(state==="menu"){
  drawMenu();return;
 }

 if(state==="playing"||state==="shop"||state==="gameover"){
  if(player){
   for(const b of bullets){
    ctx.fillStyle="#ffe28a";
    ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();
   }

   for(const e of enemies){
    ctx.fillStyle=e.color;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();

    ctx.fillStyle="#321e28";
    ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);
    ctx.fillStyle="#70ed7d";
    ctx.fillRect(e.x-e.r,e.y-e.r-9,
     e.r*2*Math.max(0,e.hp/e.maxHp),4);
   }

   for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/.4);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,4,4);
    ctx.globalAlpha=1;
   }
   drawPlayer();
   drawHUD();
  }
 }

 if(state==="shop")drawShop();
 if(state==="gameover")drawGameOver();
}

function drawMenu(){
 text("PIXEL SURVIVOR",W/2,115,48,"#63d4ff","center");
 text("SURVIVE THE ARENA",W/2,150,19,"#d4e0f0","center");
 text("CHOOSE YOUR DIFFICULTY",W/2,225,22,"white","center");

 const names=["EASY","NORMAL","HARD","EXPERT","NIGHTMARE"];
 const descriptions=[
  "Relaxed enemies","Balanced gameplay",
  "Stronger enemies","Deadly enemies",
  "Extreme survival"
 ];
 shopButtons=[];
 for(let i=0;i<5;i++){
  let x=65+i*177;
  let b=button(x,270,155,100,names[i],
   difficulties[i].color,descriptions[i]);
  shopButtons.push({...b,type:"difficulty",value:i});
 }
 text("8 UNIQUE ENEMY TYPES",W/2,440,19,"#b7c8df","center");
 text("UPGRADES • WEAPONS • ENDLESS WAVES",W/2,470,16,"#8da8c4","center");
 text("Select a difficulty to begin",W/2,525,17,"#ffe28a","center");
}

function drawShop(){
 ctx.fillStyle="rgba(9,13,23,.94)";
 ctx.fillRect(0,62,W,H-62);

 text("UPGRADE SHOP",W/2,115,32,"#64d5ff","center");
 text("Wave "+wave+" completed!",W/2,145,17,"#b9c9dc","center");
 text("Coins: "+coins,W/2,175,21,"#ffdc63","center");

 const items=[
  {id:"damage",name:"Damage Upgrade",
   desc:"+8 damage",base:20},
  {id:"speed",name:"Movement Speed",
   desc:"+20 movement speed",base:18},
  {id:"rate",name:"Attack Speed",
   desc:"Shoot faster",base:25},
  {id:"range",name:"Attack Range",
   desc:"+60 attack range",base:22},
  {id:"heal",name:"Full Heal",
   desc:"Restore all health",base:30},
  {id:"maxhp",name:"Max Health",
   desc:"+25 maximum HP",base:35}
 ];

 shopButtons=[];
 for(let i=0;i<items.length;i++){
  let item=items[i];
  let x=100+(i%3)*260;
  let y=215+Math.floor(i/3)*115;
  let price=shopPrice(item.base);
  let color=coins>=price?"#69df98":"#ed7777";
  let b=button(x,y,225,85,item.name,color,
   item.desc+" | $"+price);
  shopButtons.push({...b,type:"upgrade",item,price});
 }

 button(340,465,280,65,"START NEXT WAVE","#65d5ff",
  "Continue your survival");
 text("Shop prices increase with difficulty and wave number!",
  W/2,565,14,"#aebbd0","center");
}

function drawGameOver(){
 ctx.fillStyle="rgba(8,10,17,.85)";
 ctx.fillRect(0,62,W,H-62);
 text("YOU DIED!",W/2,230,52,"#ff606c","center");
 text("Wave reached: "+wave,W/2,290,23,"white","center");
 text("Enemies defeated: "+kills,W/2,330,19,"#d0d9e8","center");
 text("Coins collected: "+coins,W/2,365,19,"#ffdb63","center");
 button(340,415,280,65,"PLAY AGAIN","#61d5ff",
  "Choose a new difficulty");
 shopButtons=[{x:340,y:415,w:280,h:65,type:"restart"}];
}

function buy(item){
 if(item.id==="damage")player.damage+=8;
 if(item.id==="speed")player.speed+=20;
 if(item.id==="rate")
  player.fireRate=Math.max(.12,player.fireRate*.82);
 if(item.id==="range")player.range+=60;
 if(item.id==="heal")player.hp=player.maxHp;
 if(item.id==="maxhp"){
  player.maxHp+=25;
  player.hp+=25;
 }
 coins-=item.price;
}

canvas.addEventListener("click",e=>{
 const rect=canvas.getBoundingClientRect();
 const x=(e.clientX-rect.left)*W/rect.width;
 const y=(e.clientY-rect.top)*H/rect.height;

 if(state==="menu"){
  for(const b of shopButtons){
   if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
    difficulty=b.value;
    reset();
    break;
   }
  }
  return;
 }

 if(state==="gameover"){
  if(shopButtons.some(b=>x>=b.x&&x<=b.x+b.w&&
    y>=b.y&&y<=b.y+b.h)){
   state="menu";
   draw();
  }
  return;
 }

 if(state==="shop"){
  for(const b of shopButtons){
   if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
    if(b.type==="upgrade"&&coins>=b.price){
     buy(b.item);
     draw();
     return;
    }
    if(b.type==="upgrade")return;
   }
  }
  if(x>=340&&x<=620&&y>=465&&y<=530){
   wave++;
   startWave();
  }
 }
});

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "]
 .includes(e.key))e.preventDefault();
});
window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

function loop(time){
 let dt=Math.min((time-last)/1000||0,.035);
 last=time;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

draw();
requestAnimationFrame(loop);
</script>
</body>
</html>
